spring:
  application:
    name: user-service
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 1100MB
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 120000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true

server:
  port: 8081

app:
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:dev-local-internal-secret}
  student:
    email-domain: ${STUDENT_EMAIL_DOMAIN:student.edu.vn}
  student-face:
    upload-dir: ${STUDENT_FACE_UPLOAD_DIR:../../Frontend/user-frontend/public/faceId}
    rekognition-region: ${AWS_REKOGNITION_REGION:ap-southeast-1}
    rekognition-threshold: ${AWS_REKOGNITION_THRESHOLD:90}
    max-size-bytes: ${STUDENT_FACE_IMAGE_MAX_SIZE_BYTES:5242880}
    max-bulk-files: ${STUDENT_FACE_MAX_BULK_FILES:200}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
